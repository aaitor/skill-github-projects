name: Feature request
description: Propose an improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who benefits.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and alternatives
      description: Explain the result you want and any workarounds you have tried.
    validations:
      required: true
